
[project]
name = "braille-converter"
version = "0.1.0"
description = "Raster OCR to Unified English Braille converter"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=10.3",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[project.scripts]
braille-converter = "braille_converter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braille_converter"]
