
[project]
name = "braille-converter"
version = "0.2.0"
description = "Raster OCR to Unified English Braille converter"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "Pillow>=10.3",
    "nicegui>=4.0,<5",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.13",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]
native = [
    "pywebview>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "tesseract: requires a Tesseract OCR installation",
    "liblouis: requires Liblouis with UEB tables",
]

[tool.coverage.run]
source = ["braille_converter"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
braille-converter = "braille_converter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braille_converter"]
