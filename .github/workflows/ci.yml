name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Tesseract and Liblouis
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            liblouis-bin \
            liblouis-data

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Show tool versions
        run: |
          tesseract --version
          lou_translate --version || true

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q -rs

      - name: Record OCR expectations for this runner
        if: always()
        continue-on-error: true
        run: |
          uv run python scripts/generate_expected.py \
            --output-dir "${{ runner.temp }}/ocr-expected"

      - name: Upload OCR expectations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-expected-ubuntu
          path: ${{ runner.temp }}/ocr-expected/**
          if-no-files-found: warn

  # Windows is the project's primary platform: path handling,
  # upload temp-dir cleanup and tool discovery differ there.
  # Liblouis has no maintained Chocolatey package, so its
  # tests skip on this leg; Ubuntu still covers them.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $tesseractDir = "${env:ProgramFiles}\Tesseract-OCR"
          if (Test-Path "$tesseractDir\tesseract.exe") {
            "$tesseractDir" | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 -Append
          }

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Show tool versions
        shell: pwsh
        run: |
          where.exe tesseract
          tesseract --version

      - name: Lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q -rs

      - name: Record OCR expectations for this runner
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          uv run python scripts/generate_expected.py `
            --output-dir "${{ runner.temp }}/ocr-expected"

      - name: Upload OCR expectations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-expected-windows
          path: ${{ runner.temp }}/ocr-expected/**
          if-no-files-found: warn
