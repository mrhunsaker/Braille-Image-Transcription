name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Liblouis
        run: |
          sudo apt-get update
          sudo apt-get install -y liblouis-bin liblouis-data

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest
